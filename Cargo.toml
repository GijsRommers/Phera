[workspace]
resolver = "3"

members = [
    "crates/cli",
    "crates/dotenv",
    "crates/analyzer",
    "crates/lexer",
    "crates/parser",
    "crates/ast",
    "crates/source",
    "crates/value",
    "crates/bytecode",
    "crates/compiler",
    "crates/vm",
    "crates/runtime",
    "crates/server",
    "crates/phpt",
    "crates/extension-api",
    "crates/sqlite",
    "crates/io-pool",
    "crates/extensions/*",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Gijs Rommers <gijs.rommers@gmail.com>"]
license = "MIT OR Apache-2.0"

# Phera is written in safe Rust only. Unsafe code in dependencies is fine;
# unsafe code in this workspace does not compile.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
rustls-rustcrypto = "=0.1.0-pre.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
webpki-roots = "1"
futures-core = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
sha1_011 = { package = "sha1", version = "0.11" }
redis = { version = "=1.0.5", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
phera-ext-reflection = { path = "crates/extensions/reflection" }
phera-ext-redis = { path = "crates/extensions/redis" }
phera-io-pool = { path = "crates/io-pool" }
phera-dotenv = { path = "crates/dotenv" }
indexmap = "2"
itoa = "1"
regex = "1"
phera-analyzer = { path = "crates/analyzer" }
phera-lexer = { path = "crates/lexer" }
phera-parser = { path = "crates/parser" }
phera-ast = { path = "crates/ast" }
phera-source = { path = "crates/source" }
phera-value = { path = "crates/value" }
phera-bytecode = { path = "crates/bytecode" }
phera-compiler = { path = "crates/compiler" }
phera-vm = { path = "crates/vm" }
phera-runtime = { path = "crates/runtime" }
phera-server = { path = "crates/server" }
phera-phpt = { path = "crates/phpt" }
phera-extension-api = { path = "crates/extension-api" }
phera-ext-core = { path = "crates/extensions/core" }
phera-ext-ctype = { path = "crates/extensions/ctype" }
phera-ext-dom = { path = "crates/extensions/dom" }
quick-xml = "0.42"
html5ever = "0.40"
phera-ext-date = { path = "crates/extensions/date" }
phera-ext-filter = { path = "crates/extensions/filter" }
phera-ext-hash = { path = "crates/extensions/hash" }
phera-ext-http = { path = "crates/extensions/http" }
phera-ext-mbstring = { path = "crates/extensions/mbstring" }
iconv-native = "0.1"
encoding_rs = "0.8.35"
base64 = "0.22"
phera-ext-json = { path = "crates/extensions/json" }
phera-ext-openssl = { path = "crates/extensions/openssl" }
phera-ext-pcre = { path = "crates/extensions/pcre" }
phera-sqlite = { path = "crates/sqlite" }
phera-ext-sqlite3 = { path = "crates/extensions/sqlite3" }
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "column_metadata", "column_decltype", "backup"] }
phera-ext-pdo = { path = "crates/extensions/pdo" }
phera-ext-random = { path = "crates/extensions/random" }
phera-ext-serialize = { path = "crates/extensions/serialize" }
phera-ext-session = { path = "crates/extensions/session" }
phera-ext-spl = { path = "crates/extensions/spl" }
phera-ext-standard = { path = "crates/extensions/standard" }
command-fds = "0.3.3"
phera-ext-process = { path = "crates/extensions/process" }
phera-ext-streams = { path = "crates/extensions/streams" }
phera-ext-tokenizer = { path = "crates/extensions/tokenizer" }
aes = "0.9"
aes-gcm = { version = "0.11", features = ["hazmat"] }
cbc = "0.2"
ccm = "0.6"
cfb-mode = "0.9"
chacha20poly1305 = "0.11"
ctr = "0.10"
ecb = "0.2"
ofb = "0.7"
p256 = { version = "0.14", features = ["ecdh"] }
p384 = { version = "0.14", features = ["ecdh"] }
p521 = { version = "0.14", features = ["ecdh"] }
ed25519-dalek = { version = "3", features = ["pem"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
pkcs8 = { version = "0.11", features = ["pem", "encryption", "sha1-insecure", "3des"] }
sec1 = "0.8"
x509-cert = "0.3"


sha1-rsa = { package = "sha1", version = "0.11", features = ["oid"] }
md5-rsa = { package = "md-5", version = "0.11", features = ["oid"] }
sha3-rsa = { package = "sha3", version = "0.11", features = ["oid"] }
ripemd-rsa = { package = "ripemd", version = "0.2", features = ["oid"] }
pbkdf2 = "0.12"
digest = "0.10"
md2 = "0.10"
md4 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
whirlpool = "0.10"
gost94 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }
subtle = "2.6"
bcrypt = "0.17"
argon2 = "0.5"
pwhash = "1"
getrandom = "0.3"
bytes = "1"
percent-encoding = "2"
nix = { version = "0.31", default-features = false, features = ["user", "resource", "feature", "net"] }
rustix = { version = "1", features = ["fs", "param", "process", "system", "termios", "time"] }
rustix-libc-wrappers = { version = "0.1.1", features = ["process"] }
sysinfo = { version = "0.39.3", default-features = false, features = ["system"] }
tempfile = "3"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "http1", "server-graceful"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = [
    "rt", "rt-multi-thread", "net", "time", "sync", "signal", "macros", "fs",
] }
# HTTP dates ("Sun, 06 Nov 1994 08:49:37 GMT"); hyper depends on it already.
httpdate = "1"
# Compressing responses in `phera serve`. Both are Rust all the way down:
# flate2 with its default miniz_oxide backend, and Dropbox's brotli.
flate2 = "1"
brotli = "9"
fluent-uri = "0.4.1"
url = "2.5"
foldhash = "0.2"
hashbrown = { version = "0.17", default-features = false }
mimalloc = { version = "0.1", default-features = false }
# PHP's own regex engine. Pinned because the bundled PCRE2 source version
# (10.46) decides compile error texts.
pcre2 = "=0.2.11"
pcre2-sys = "=0.2.10"

tokio-postgres = "0.7.18"
mysql_async = { version = "0.37.1", default-features = false, features = [
    "minimal-rust",
    "rustls-tls",
] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tz-rs = { version = "=0.7.3", default-features = false, features = ["alloc"] }
jiff-tzdb = "=0.1.9"
tzdb_data = "=0.2.5"

# Release builds are what gets measured and deployed. Whole-program
# optimisation lets the compiler inline across crates (the value type lives in
# one crate, the interpreter loop in another); it costs build time, not run time.
[profile.release]
lto = "fat"
codegen-units = 1
