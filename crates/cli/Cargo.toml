[package]
name = "phera-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phera"
path = "src/main.rs"

[dependencies]
phera-dotenv.workspace = true
phera-analyzer.workspace = true
phera-runtime.workspace = true
phera-server.workspace = true
tokio.workspace = true
httpdate.workspace = true
# The system allocator on macOS is slow for the many small allocations an
# interpreter makes (strings, arrays, objects).
mimalloc.workspace = true

[dev-dependencies]
phera-extension-api.workspace = true
phera-phpt.workspace = true

# Selected PHP tests run during cargo test; unsupported features carry XFAIL reasons.
[[test]]
name = "phpt"
harness = false

[lints]
workspace = true
