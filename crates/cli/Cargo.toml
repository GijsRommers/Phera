[package]
name = "phera-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phera"
path = "src/main.rs"

[dependencies]
phera-packages.workspace = true
phera-dotenv.workspace = true
phera-analyzer.workspace = true
phera-runtime.workspace = true
phera-server.workspace = true
tokio.workspace = true
httpdate.workspace = true
flate2.workspace = true
brotli.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
phera-io-pool.workspace = true
rustix.workspace = true
semver = "1"
serde_json = "1"
base16ct.workspace = true
sha2.workspace = true
tar = { version = "0.4.46", default-features = false }
tempfile.workspace = true
tokio-rustls.workspace = true
url.workspace = true
# The system allocator on macOS is slow for the many small allocations an
# interpreter makes (strings, arrays, objects).
mimalloc.workspace = true

[dev-dependencies]
futures-util.workspace = true
phera-extension-api.workspace = true
phera-phpt.workspace = true
rcgen.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect"] }

# Selected PHP tests run during cargo test; unsupported features carry XFAIL reasons.
[[test]]
name = "phpt"
harness = false

[lints]
workspace = true
