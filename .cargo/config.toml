# PHP's regex engine is built from the bundled PCRE2 source so the build does not depend on what is installed.
[env]
PCRE2_SYS_STATIC = "1"
# Match PHP's SQLite capabilities; use the bundled amalgamation, never a system library.
LIBSQLITE3_FLAGS = """
-USQLITE_DEFAULT_FOREIGN_KEYS -USQLITE_SOUNDEX
SQLITE_ENABLE_MATH_FUNCTIONS
SQLITE_ENABLE_GEOPOLY
SQLITE_ENABLE_PERCENTILE
SQLITE_ENABLE_MEMORY_MANAGEMENT
SQLITE_ENABLE_PREUPDATE_HOOK
SQLITE_ENABLE_SESSION
SQLITE_ENABLE_UNLOCK_NOTIFY
SQLITE_MAX_VARIABLE_NUMBER=250000
"""
