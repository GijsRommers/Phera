name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v0.1.0'
        required: true
        type: string
      dry_run:
        description: 'Build archives from the selected branch without publishing'
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve source commit and check the tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0." >&2
            exit 1
          fi
          if [[ "$DISPATCH" == true && "$DRY_RUN" != true ]]; then
            git fetch --no-tags origin "refs/tags/$TAG" || {
              echo "The release tag $TAG must already exist." >&2
              exit 1
            }
            git checkout --detach FETCH_HEAD
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match the workspace version $version." >&2
            exit 1
          fi
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tag=$TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: macos, arch: arm64, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, os: macos, arch: x86_64, target: x86_64-apple-darwin }
          - { runner: ubuntu-22.04, os: linux, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.99.1' # Keep in sync with rust-toolchain.toml.
      - name: Build and package Phera
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          # The -sys crates compile bundled PCRE2 and SQLite with the runner's C compiler.
          cc --version
          cargo build --locked --release -p phera-cli --target "$TARGET"
          binary="target/$TARGET/release/phera"
          actual=$(env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" "$binary" --version)
          if [[ "$actual" != "Phera $VERSION" ]]; then
            echo "Built version '$actual' does not match tag v$VERSION." >&2
            exit 1
          fi
          mkdir package
          cp "$binary" LICENSE-MIT LICENSE-APACHE package/
          COPYFILE_DISABLE=1 tar --format ustar -czf "phera-$VERSION-$PLATFORM.tar.gz" \
            -C package phera LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: phera-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
      - run: sha256sum phera-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, checksums]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: Publish archives on the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "${TAG%%+*}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes "${flags[@]}" phera-*.tar.gz SHA256SUMS
