name: CI

on:
  pull_request:
    # `ready_for_review` starts the long jobs when a draft becomes ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.99.1' # Keep in sync with rust-toolchain.toml.
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.99.1'
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The test suite runs as three jobs side by side. In one job it took 20
  # minutes, and a third of that was one crate: `cargo test` runs the test
  # programs one after another. Each part has its own build cache, because
  # each builds a different set of crates.
  test-part:
    name: Tests (${{ matrix.part.name }})
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: mbstring
            key: mbstring
            packages: --package phera-ext-mbstring
          - name: command line and fixtures
            key: cli
            packages: --package phera-cli
          - name: all other crates
            key: rest
            packages: --workspace --exclude phera-ext-mbstring --exclude phera-cli
    # A draft gets the short checks only. Work in progress is pushed
    # often, and its long jobs kept finished pull requests waiting for a
    # free runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.4.0
        ports: ['16399:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phera_test
          POSTGRES_USER: phera
          POSTGRES_PASSWORD: phera
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U phera -d phera_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: phera_test
          MYSQL_USER: phera
          MYSQL_PASSWORD: phera
          MYSQL_ROOT_PASSWORD: phera-root
        ports: ['33069:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u phera -pphera --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-${{ matrix.part.key }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: >-
            json, pcre, ctype, pdo, pdo_pgsql, mysqlnd, pdo_mysql, pdo_sqlite, sqlite3, mbstring, iconv, tokenizer, openssl, libxml, dom,
            timezonedb-2026.5, redis-phpredis/phpredis@6.3.0
          coverage: none
        env:
          REDIS_PATH: .
          REDIS_CONFIGURE_OPTS: >-
            --enable-redis --disable-redis-igbinary --disable-redis-msgpack
            --disable-redis-lzf --disable-redis-zstd --disable-redis-lz4
      - name: Build the slim date oracle when PHP uses system tzdata
        run: bash .github/scripts/build-date-oracle.sh
      - name: Export PHP oracle
        run: |
          echo "PHERA_PHP_REAL=$(command -v php)" >> "$GITHUB_ENV"
          echo "PHERA_PHP=$GITHUB_WORKSPACE/.github/scripts/php-oracle.sh" >> "$GITHUB_ENV"
          echo "PHERA_PHP_SHARED_EXTENSIONS=$(php -n -r 'foreach (["json", "pcre", "ctype", "pdo", "pdo_pgsql", "mysqlnd", "pdo_mysql", "pdo_sqlite", "sqlite3", "mbstring", "iconv", "tokenizer", "openssl", "libxml", "dom", "timezonedb", "redis"] as $e) { if (!extension_loaded($e)) echo "$e "; }')" >> "$GITHUB_ENV"
      # Fail on missing prerequisites instead of silently skipping the PDO suites.
      - name: Verify PHP version, extensions and database connections
        run: make ci-prerequisites
      - name: Test against real PHP
        run: cargo test ${{ matrix.part.packages }} --no-fail-fast

  test:
    name: Test (Linux, PHP 8.5, PostgreSQL 17, MySQL 8.4)
    # The name is a required check in the branch protection, so it stays. It
    # passes when every part of the suite passed. `always()` makes it fail
    # when a part failed: a skipped job would count as passed.
    needs: test-part
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Every part of the test suite passed
        run: test "${{ needs.test-part.result }}" = "success"

  pdo-end-to-end:
    name: PDO end to end
    # The name is a required check in the branch protection, so it stays as it
    # is although the job now runs the SQLite and Redis comparisons too.
    # Runs the comparison scripts of PDO, SQLite3 and Redis through the release
    # binary; every one of them must match real PHP.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.4.0
        ports: ['16399:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phera_test
          POSTGRES_USER: phera
          POSTGRES_PASSWORD: phera
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U phera -d phera_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: phera_test
          MYSQL_USER: phera
          MYSQL_PASSWORD: phera
          MYSQL_ROOT_PASSWORD: phera-root
        ports: ['33069:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u phera -pphera --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: >-
            json, pcre, ctype, pdo, pdo_pgsql, mysqlnd, pdo_mysql, pdo_sqlite, sqlite3, mbstring, iconv, tokenizer, openssl, libxml, dom,
            timezonedb-2026.5, redis-phpredis/phpredis@6.3.0
          coverage: none
        env:
          REDIS_PATH: .
          REDIS_CONFIGURE_OPTS: >-
            --enable-redis --disable-redis-igbinary --disable-redis-msgpack
            --disable-redis-lzf --disable-redis-zstd --disable-redis-lz4
      - name: Build the slim date oracle when PHP uses system tzdata
        run: bash .github/scripts/build-date-oracle.sh
      - name: Export PHP oracle
        run: |
          echo "PHERA_PHP_REAL=$(command -v php)" >> "$GITHUB_ENV"
          echo "PHERA_PHP=$GITHUB_WORKSPACE/.github/scripts/php-oracle.sh" >> "$GITHUB_ENV"
          echo "PHERA_PHP_SHARED_EXTENSIONS=$(php -n -r 'foreach (["json", "pcre", "ctype", "pdo", "pdo_pgsql", "mysqlnd", "pdo_mysql", "pdo_sqlite", "sqlite3", "mbstring", "iconv", "tokenizer", "openssl", "libxml", "dom", "timezonedb", "redis"] as $e) { if (!extension_loaded($e)) echo "$e "; }')" >> "$GITHUB_ENV"
      # Fail on missing prerequisites instead of silently skipping the PDO suites.
      - name: Verify PHP version, extensions and database connections
        run: make ci-prerequisites
      - name: Build end-to-end binary
        run: make ci-build
      - name: Compare DOM scripts against PHP
        run: cargo test -p phera-ext-dom --test php_oracle
        env:
          PHERA_BIN: ${{ github.workspace }}/target/release/phera
      - name: Run the date class scripts through the release binary
        run: cargo test -p phera-ext-date --test class_scripts
        env:
          PHERA_BIN: ${{ github.workspace }}/target/release/phera
      - name: Compare files and streams against PHP and exercise one-worker I/O
        run: cargo test -p phera-ext-streams --test scripts --test concurrency --no-fail-fast
        env:
          PHERA_BIN: ${{ github.workspace }}/target/release/phera
      - name: Run PDO, SQLite3 and Redis tests through the release binary
        run: cargo test -p phera-ext-pdo -p phera-ext-sqlite3 -p phera-ext-redis --no-fail-fast
        env:
          PHERA_BIN: ${{ github.workspace }}/target/release/phera

  safe-rust:
    name: No unsafe Rust (including cfg-disabled code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Scan tokens as a second guard beyond workspace unsafe_code = "forbid".
      - run: python3 .github/scripts/check-unsafe.py

  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.99.1'
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit the lockfile
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys

          with open(".github/advisory-ignores.json", encoding="utf-8") as ignore_file:
              ignored = json.load(ignore_file)

          audit = ["cargo", "audit", "--deny", "warnings", "--no-yanked"]
          for advisory, reason in ignored.items():
              if not re.fullmatch(r"RUSTSEC-\d{4}-\d+", advisory):
                  sys.exit(f"Invalid RustSec advisory ID: {advisory}")
              if not isinstance(reason, str) or not reason.strip():
                  sys.exit(f"Missing reason for ignoring {advisory}")
              audit.extend(["--ignore", advisory])

          subprocess.run(audit, check=True)
          PY
